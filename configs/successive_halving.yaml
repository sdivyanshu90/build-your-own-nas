# Successive halving: many cheap evaluations, few expensive ones.
#
# The ladder below starts at 1 epoch and multiplies by 3 at each rung, while the surviving
# population divides by 3:
#
#   rung 0 : 9 candidates x  1 epoch
#   rung 1 : 3 candidates x  3 epochs
#   rung 2 : 1 candidate  x  9 epochs
#
# Total: 9 + 9 + 9 = 27 epoch-evaluations, versus 81 to train all nine to full fidelity.
#
# The assumption is that a 1-epoch ranking predicts the 9-epoch ranking. It often does,
# but not always — see docs/concepts/successive-halving.md for the failure modes, in
# particular the bias against architectures that train slowly at first.
version: 1

project:
  name: successive_halving
  description: Single-bracket successive halving with eta = 3 over three rungs.
  output_dir: artifacts/successive_halving

dataset:
  provider: synthetic
  batch_size: 64
  num_workers: 0
  options:
    num_classes: 10
    input_channels: 3
    input_size: 32
    train_samples: 4096
    validation_samples: 1024
    test_samples: 1024
    noise_scale: 0.8
    seed: 42

search_space:
  preset: default_cnn

algorithm:
  name: successive_halving
  params:
    initial_candidates: 9
    num_rungs: 3
    reduction_factor: 3.0
    scale_epochs: true
    # Scaling the data fraction as well changes the effective regularisation between
    # rungs, not only the compute, which biases early rungs towards small models. Enable
    # it only if epoch scaling alone is too slow.
    scale_train_fraction: false
    scale_resolution: false

budget:
  # Rung 0 sets the base fidelity; later rungs multiply it by the reduction factor.
  max_evaluations: 13
  epochs: 1
  max_seconds_per_evaluation: 900

training:
  optimizer:
    name: adamw
    learning_rate: 0.002
    weight_decay: 0.0001
  scheduler:
    # The schedule is rescaled to each rung's epoch budget, so a rung-0 candidate still
    # anneals fully rather than stopping mid-schedule.
    name: cosine
    min_lr_factor: 0.01
  gradient_clip_norm: 5.0
  topk: 5

evaluation:
  measure_latency: true
  save_weights: true
  max_parameters: 2000000

objectives:
  objectives:
    - metric: validation_accuracy
      direction: maximize
      weight: 1.0
      normalization: minmax
    - metric: trainable_parameters
      direction: minimize
      weight: 0.2
      normalization: log
  constraints: []

persistence:
  database_path: nas.db
  artifact_dir: candidates
  report_dir: reports
  checkpoint_every: 1
  keep_checkpoints: 5

logging:
  level: INFO
  format: console

hardware:
  device: auto

concurrency:
  mode: sequential
  workers: 1

reproducibility:
  seed: 42
  deterministic: true
  warn_only: true

retry:
  max_retries: 1
