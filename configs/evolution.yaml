# Regularized (aging) evolution over the default CNN space.
#
# Population size and tournament size are the two knobs that matter:
#   * population_size sets how long an architecture survives — exactly that many
#     subsequent evaluations, because aging removes the oldest member.
#   * tournament_size sets selection pressure. 1 is a random walk; population_size always
#     picks the current best and collapses diversity. A quarter of the population is the
#     usual compromise.
#
#   nas-engine search --config configs/evolution.yaml --report
#   nas-engine resume --config configs/evolution.yaml     # after an interruption
version: 1

project:
  name: regularized_evolution
  description: Aging evolution with a 16-member population and 4-way tournaments.
  output_dir: artifacts/evolution

dataset:
  provider: synthetic
  batch_size: 64
  num_workers: 0
  options:
    num_classes: 10
    input_channels: 3
    input_size: 32
    train_samples: 4096
    validation_samples: 1024
    test_samples: 1024
    noise_scale: 0.8
    seed: 42

search_space:
  preset: default_cnn

algorithm:
  name: regularized_evolution
  params:
    population_size: 16
    tournament_size: 4
    allow_duplicate_children: false
    mutation_attempts: 25

budget:
  max_evaluations: 40
  epochs: 5
  max_seconds_per_evaluation: 900

training:
  optimizer:
    name: adamw
    learning_rate: 0.002
    weight_decay: 0.0001
  scheduler:
    name: cosine
    warmup_steps: 20
    min_lr_factor: 0.01
  gradient_clip_norm: 5.0
  label_smoothing: 0.05
  topk: 5

evaluation:
  measure_latency: true
  save_weights: true
  max_parameters: 2000000

objectives:
  objectives:
    - metric: validation_accuracy
      direction: maximize
      weight: 1.0
      normalization: minmax
    - metric: trainable_parameters
      direction: minimize
      weight: 0.25
      normalization: log
  constraints:
    - metric: trainable_parameters
      operator: le
      threshold: 2000000

persistence:
  database_path: nas.db
  artifact_dir: candidates
  report_dir: reports
  checkpoint_every: 1
  keep_checkpoints: 5

logging:
  level: INFO
  format: console

hardware:
  device: auto

concurrency:
  mode: sequential
  workers: 1

reproducibility:
  seed: 42
  deterministic: true
  warn_only: true

retry:
  max_retries: 1
